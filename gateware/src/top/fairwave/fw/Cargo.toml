[package]
name = "tiliqua-fw"
version = "0.1.0"
edition = "2021"

[dependencies]
guh-dma = { git = "https://github.com/apfaudio/guh", rev = "32e7f0d" }
guh-usb-msc = { git = "https://github.com/apfaudio/guh", rev = "32e7f0d", default-features = false, features = ["fatfs"] }
fatfs = { git = "https://github.com/vk2seb/rust-fatfs.git", branch = "seb/dma-geo", default-features = false, features = ["lfn"] }
tiliqua-hal = { path="../../../rs/hal", default-features = false }
tiliqua-lib = { path = "../../../rs/lib" }
tiliqua-pac = { path="../pac", default-features = false, features = ["critical-section", "vexriscv"] }
fairwave-cpu = { path = "../cpu" }

log = "0.4.17"
embedded-hal = "=1.0.0"
riscv = { version = "=0.11.1", features = ["critical-section-single-hart"] }
riscv-rt = { version = "=0.12.2", features = ["single-hart"] }
heapless = "0.8.0"
critical-section = "1.2.0"
amaranth-soc-isr = { path="../../../rs/isr", default-features = false }
irq = "0.2.3"

[profile.release]
codegen-units = 1
debug = true
debug-assertions = false
incremental = false
lto = true
opt-level = "s"
overflow-checks = false
